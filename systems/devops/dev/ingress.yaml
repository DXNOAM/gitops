apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-nginx-app
spec:
  ingressClassName: nginx
  rules:
    - host: nginx-dev.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-nginx-app
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-nginx-app
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
